<style>

.scr{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column}
.scr.on{display:flex}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;min-height:var(--bs)}
.btn{padding:0 28px;border:1px solid var(--pk);border-radius:999px;background:rgba(255,60,142,.12);letter-spacing:.12em;transition:.2s}

.sky.a{animation:drift calc(24s/var(--mo)) linear infinite alternate;background-size:100% 140%}

.sun{position:absolute;left:50%;bottom:15%;width:30vmin;height:30vmin;margin-left:-15vmin;border-radius:50%;background:linear-gradient(#ffe36e,#ff4f9a);opacity:.8;z-index:-1;clip-path:inset(0 0 8% 0)}

.title{font-size:clamp(34px,8vw,84px);background:linear-gradient(90deg,var(--or),var(--pk),var(--vi));-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}

#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .8s;z-index:50}
#fade.on{opacity:1}

#vid{background:#000;flex-direction:row;align-items:stretch;justify-content:flex-start}
#strip{width:60px;display:flex;flex-direction:column;align-items:center;padding-top:8px;background:#000;flex:none}

#plw{flex:1;position:relative;background:#000}
#plw iframe,#pl{position:absolute;inset:0;width:100%;height:100%}
#skip{position:absolute;right:calc(10px + env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));z-index:5}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(0,0,0,.82);z-index:6;text-align:center;padding:20px}
.ov.on{display:flex}
.spin{width:44px;height:44px;border:4px solid rgba(255,255,255,.2);border-top-color:var(--pk);border-radius:50%;animation:sp 1s linear infinite;display:none;position:absolute;top:50%;left:50%;margin:-22px;z-index:4;pointer-events:none}
.spin.on{display:block}@keyframes sp{to{transform:rotate(360deg)}}

#bar{width:min(480px,70vw);height:3px;background:rgba(255,255,255,.2);margin:14px 0}#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pk),var(--or))}

#ph{display:flex;align-items:center;gap:12px;margin-bottom:8px}

.art{height:120px;border-radius:12px;display:flex;align-items:flex-end;padding:8px;font-size:.85em}
input[type=range]{width:200px;accent-color:var(--pk)}input[type=text]{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:8px;font:inherit;user-select:text;-webkit-user-select:text}
.pbar{height:6px;background:rgba(255,255,255,.15);border-radius:3px;display:flex;overflow:hidden}.pbar i{flex:1}.pbar i.w{background:var(--tl)}
#dlg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center}#dlg.on{display:flex}
#dlg div{background:#1a0b2e;border:1px solid var(--pk);border-radius:18px;padding:22px;max-width:420px;text-align:center}
#dlg .row{justify-content:center}
#port{position:fixed;inset:0;z-index:70;background:#0d0518;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:1.2em}
@media (orientation:portrait){#port{display:flex}}
body.hc{--bg:#000;--tx:#fff;--mt:.97}body.hc .card{border-color:#fff}
body.nm *{animation:none!important;transition:none!important}
svg text{fill:#fff;font-size:11px}
</style></head><body>

<!-- opening -->
<section class="scr on" id="s0" style="background:#000"><button class="btn" id="start">START</button><p class="sub" style="position:absolute;bottom:14px">Unofficial fan project. Not affiliated with Rockstar Games.</p></section>

const el=(h)=>{const d=document.createElement('div');d.className='card';d.innerHTML=h;return d};
function slotRow(B,k,load){const s=k==='auto'?SV.auto:SV.slots[k];const c=el('');const nm=k==='auto'?'Autosave':'Slot '+(k+1);
 c.innerHTML=s?`<div class="row"><b>${nm}: ${s.name.replace(/</g,'&lt;')}</b><span>${s.pct}% · ${fm(s.t)} / ${fm(s.dur)}</span></div><div class="sub" style="text-align:left;letter-spacing:0">Created ${fd(s.created)} · Last played ${fd(s.played)} · Viewing time ${fm(s.watch)}</div><div class="row"></div>`:`<div class="row"><b>${nm}</b><span class="sub">Empty</span></div><div class="row"></div>`;
 const r=c.lastChild,add=(l,f)=>{const b=document.createElement('button');b.className='btn sm';b.textContent=l;b.onclick=f;r.append(b)};
 if(load){if(s)add('LOAD',()=>playStory(s.t,k,true))}
 else{add(s?'OVERWRITE':'SAVE HERE',async()=>{if(s&&!await ask('Overwrite '+nm+'?',[['Cancel',0],['Overwrite',1]]))return;saveNow(k);selTab('save')})}
 if(s&&k!=='auto'){add('RENAME',async()=>{const n=prompt('Save name',s.name);if(n){SV.slots[k].name=n.slice(0,30);sv();selTab(tab)}});add('DELETE',async()=>{if(await ask('Delete '+nm+'?',[['Cancel',0],['Delete',1]])){SV.slots[k]=null;sv();selTab(tab)}})}
 if(s&&k==='auto'&&load){add('DELETE',async()=>{if(await ask('Delete autosave?',[['Cancel',0],['Delete',1]])){SV.auto=null;sv();selTab(tab)}})}
 B.append(c)}
const R={
 load:B=>{slotRow(B,'auto',1);for(let i=0;i<5;i++)slotRow(B,i,1)},
 save:B=>{if(!P||!P.getCurrentTime){B.append(el('Saving is available while watching the Story Experience.'));return}for(let i=0;i<5;i++)slotRow(B,i,0)},
 gallery:B=>{const g=document.createElement('div');g.className='g';SC.forEach((c,i)=>{const d=document.createElement('div');d.className='art';d.style.background=c;d.textContent=['Sunset skyline','Keys at dusk','Neon avenue','Grassrivers swamp','Ocean drive night','Port at dawn'][i];g.append(d)});B.append(g,el('<span class="sub" style="letter-spacing:0">Original schematic artwork made for this fan project. Not official Rockstar artwork.</span>'))},
 chars:B=>{[['Jason Duval','One of two playable protagonists confirmed by Rockstar Games for Grand Theft Auto VI. Shown in the official trailers.'],['Lucia Caminos','The other confirmed protagonist, introduced in Trailer 1. Rockstar has described the duo as a story of partners on the run in Leonida.']].forEach(([n,d])=>B.append(el(`<h3>${n} <span class="tag">Confirmed</span></h3><p>${d}</p><p class="sub" style="text-align:left;letter-spacing:0">Further details are not officially published here and none are invented.</p>`)))},
 credits:B=>{B.append(el('<h3>Unofficial fan project</h3><p>This is not an official Rockstar Games release or a native iOS version of GTA VI. Grand Theft Auto and related names belong to Rockstar Games / Take-Two Interactive. Videos are streamed from YouTube through the official IFrame Player API; no footage is hosted or modified here. The Story Experience is prerecorded footage, not gameplay.</p>'))},
 story:B=>{const t=P&&P.getCurrentTime?P.getCurrentTime():PR.t,d=(P&&P.getDuration?P.getDuration():0)||PR.dur,pc=d?Math.round(t/d*100):0;
  B.append(el(`<div class="row"><b>Position</b><span>${fm(t)} / ${fm(d)} (${pc}%)</span></div><div class="pbar">${PR.b.map(x=>'<i class="'+(x?'w':'')+'"></i>').join('')}</div><p class="sub" style="text-align:left;letter-spacing:0">Teal sections are watched. Watching the video does not mean completing a game.</p>`));
  const c=el('<div class="row"><b>Bookmarks</b></div>');const ab=document.createElement('button');ab.className='btn sm';ab.textContent='BOOKMARK THIS MOMENT';ab.onclick=()=>{const n=prompt('Chapter name','Moment '+(PR.bm.length+1));if(n){PR.bm.push({n:n.slice(0,30),t});PR.bm.sort((a,b)=>a.t-b.t);svp();selTab('story')}};c.firstChild.append(ab);
  PR.bm.forEach((b,i)=>{const r=document.createElement('div');r.className='row';r.innerHTML=`<span>${b.n.replace(/</g,'&lt;')} · ${fm(b.t)}</span>`;const go=document.createElement('button');go.className='btn sm';go.textContent='GO';go.onclick=()=>{if(P&&P.seekTo){inPause=false;closePanel();P.seekTo(b.t,true);P.playVideo()}else playStory(b.t,'auto')};const del=document.createElement('button');del.className='btn sm';del.textContent='REMOVE';del.onclick=()=>{PR.bm.splice(i,1);svp();selTab('story')};r.append(go,del);c.append(r)});
  if(!PR.bm.length)c.append(Object.assign(document.createElement('p'),{className:'sub',textContent:'No chapters found for this video. Add your own bookmarks.'}));B.append(c);
  const rs=document.createElement('button');rs.className='btn sm';rs.textContent='RESTART EXPERIENCE';rs.onclick=()=>selTab('restart');if(fromPause)B.append(rs)},
 map:B=>{const L=LOC;const w=document.createElement('div');w.innerHTML=`<svg viewBox="0 0 400 260" style="width:100%;max-height:48vh;background:#1a0b2e;border-radius:14px"><path d="M60 20 L330 20 L350 80 L300 130 L330 200 L250 240 L180 215 L120 240 L80 160 L90 90Z" fill="#3a1b5e" stroke="#ff3c8e"/>${L.map((l,i)=>`<g data-i="${i}" style="cursor:pointer"><circle cx="${l.x}" cy="${l.y}" r="14" fill="${l.c?'#2de2c8':'#ff9a4d'}" opacity=".9"/><text x="${l.x+16}" y="${l.y+4}">${l.n}</text></g>`).join('')}</svg><div id="li"></div><p class="sub" style="text-align:left;letter-spacing:0">Schematic fan map, not Rockstar's map. Teal = officially named, orange = speculative.</p>`;B.append(w);const show=i=>{const l=L[i];$('#li').innerHTML=`<div class="card"><h3>${l.n} <span class="tag ${l.c?'':'s'}">${l.c?'Confirmed name':'Speculative'}</span></h3><p>${l.d}</p></div>`};w.querySelectorAll('g').forEach(g=>g.onclick=()=>show(+g.dataset.i));show(0)},
 world:B=>{B.append(el('<h3>Atmosphere</h3><p>Rockstar\'s trailers show neon-lit nights, beaches, highways, swamps, boats and wildlife in a Florida-inspired state. <span class="tag">Confirmed</span></p><p>Specific vehicle lists, wildlife species and architecture details beyond what the trailers show are fan interpretation. <span class="tag s">Speculative</span></p>'));LOC.forEach(l=>B.append(el(`<b>${l.n}</b> <span class="tag ${l.c?'':'s'}">${l.c?'Confirmed name':'Speculative'}</span><p>${l.d}</p>`)))},
 settings:B=>{const sec=t=>B.append(Object.assign(document.createElement('h3'),{textContent:t,style:'margin:14px 0 6px'}));
  const sl=(l,k,mn,mx,st,f)=>{const c=el(`<div class="row"><span>${l}</span><input type="range" min="${mn}" max="${mx}" step="${st}" value="${S[k]}"></div>`);c.querySelector('input').oninput=e=>{S[k]=+e.target.value;svs();applyS();f&&f()};B.append(c)};
  const tg=(l,k,f)=>{const c=el(`<div class="row"><span>${l}</span><button class="btn sm">${S[k]?'ON':'OFF'}</button></div>`);const b=c.querySelector('button');b.onclick=()=>{S[k]=!S[k];b.textContent=S[k]?'ON':'OFF';svs();applyS();f&&f()};B.append(c)};
  sec('Audio');sl('Master volume','vol',0,100,1);tg('Mute','mute');B.append(el('<span class="sub" style="letter-spacing:0">On iPhone and iPad, volume may only respond to the physical volume buttons. The original soundtrack is always preserved.</span>'));
  sec('Display');const fsb=el('<div class="row"><span>Fullscreen</span><button class="btn sm">TOGGLE</button></div>');fsb.querySelector('button').onclick=()=>{const e=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else if(e.requestFullscreen||e.webkitRequestFullscreen)call(e);else ask('Fullscreen is limited on iPhone Safari. Add to Home Screen for a fullscreen app, or use the video\'s own fullscreen button.',[['OK',1]])};B.append(fsb);
  sl('Menu transparency (higher = darker)','mt',.4,.97,.01);tg('Reduced motion','rm');tg('Menu animations','anim');
  B.append(el('<span class="sub" style="letter-spacing:0">Video quality is chosen automatically by YouTube and cannot be forced. Nothing here upscales prerecorded footage.</span>'));
  sec('Interface');sl('Text size','fs',13,24,1);sl('Button size','bs',40,68,2);
  sec('Playback');tg('Auto-continue to next video','auto');tg('Automatic saving','autosave');tg('Skip opening videos on Start','skip');tg('Subtitles when available (applies next load)','cc');
  const o=el('<div class="row"><span>Opening sequence</span><button class="btn sm">RESTART OPENING</button></div>');o.querySelector('button').onclick=async()=>{closePanel();await fade(1);destroyP();inPause=false;show('vid');$('#strip').style.display='none';loadVid(0);await fade(0)};B.append(o);
  sec('Accessibility');tg('High-contrast menus','hc');
  const rd=el('<div class="row"><span>Restore defaults</span><button class="btn sm">RESET</button></div>');rd.querySelector('button').onclick=async()=>{if(await ask('Restore all settings to default?',[['Cancel',0],['Restore',1]])){S={...DEF};svs();applyS();selTab('settings')}};B.append(rd)}};
const LOC=[{n:'Leonida',x:200,y:130,c:1,d:'The fictional US state where Grand Theft Auto VI is set, inspired by Florida.'},{n:'Vice City',x:260,y:75,c:1,d:'The neon, beach-lined city returning from earlier games in the series, shown in the trailers.'},{n:'Leonida Keys',x:150,y:225,c:1,d:'An island chain at the southern end of the state, named by Rockstar.'},{n:'Grassrivers',x:120,y:120,c:1,d:'A swampland region, named by Rockstar and shown in trailer footage.'},{n:'Port Gellhorn',x:290,y:165,c:1,d:'A named location in Leonida. Rockstar has shared little detail beyond the name.'},{n:'Ambrosia',x:95,y:55,c:1,d:'A named location in Leonida. Rockstar has shared little detail beyond the name.'},{n:'Mount Kalaga National Park',x:190,y:50,c:1,d:'A named national park area in the state. Exact placement on this schematic is invented.'}];
function call(e){const f=e.requestFullscreen||e.webkitRequestFullscreen;f.call(e)}
// init
addEventListener('pagehide',()=>{if(cur===2&&P&&P.getCurrentTime){saveNow('auto',1)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&cur===2&&P&&P.getCurrentTime&&mode==='story')saveNow('auto',1)});
document.addEventListener('touchmove',e=>{if(!e.target.closest('#pb,.menu,#tabs,iframe'))e.preventDefault()},{passive:false});
applyS();
</script></body></html>
